[tool.poetry]
name = "flaresystems-mcp"
version = "0.1.0"
description = "Agent-native MCP surface for the fwd+clif system (ADR-0006) — OBSERVE reads + the membraned funding ACT tools. Custody-isolated: holds no keys and no tokens; execs the already-scoped clif containers, bounded by fwd policy."
authors = ["African Proofs"]
readme = "README.md"
packages = [{ include = "flaresystems_mcp", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
mcp = { version = ">=1.2,<2.0", extras = ["cli"] }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.6"

[tool.poetry.scripts]
flaresystems-mcp = "flaresystems_mcp.server:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
